name: picks
on:
  schedule: [{cron: "0 * * * *"}]  # cada hora; si hay una corriendo, la siguiente espera y la releva
  workflow_dispatch:
concurrency: picks
permissions:
  actions: write  # para encargar el relevo
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - run: pip install telethon && npm install -g @anthropic-ai/claude-code
      - run: python -u picks.py
        env:
          TG_SESSION: ${{ secrets.TG_SESSION }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          DESTINO: ${{ secrets.DESTINO }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          STATS: ${{ secrets.STATS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          DURACION: 20400  # 5h40m conectado, revisando cada minuto
      # Relevo: el cron de GitHub a veces se salta horas y quedaba un hueco sin job. Solo si acabó bien (evita bucles si peta).
      - run: gh workflow run picks.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
